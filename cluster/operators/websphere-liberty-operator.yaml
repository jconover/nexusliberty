---
# OperatorGroup scopes the operator to the liberty-apps namespace
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: liberty-operator-group
  namespace: liberty-apps
spec:
  targetNamespaces:
    - liberty-apps
---
# Subscription installs the Open Liberty Operator from community catalog
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: open-liberty
  namespace: liberty-apps
spec:
  channel: v1.4
  name: open-liberty-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
