---
# HTPasswd OAuth provider for OKD cluster authentication.
#
# WARNING: HTPasswd is suitable for development and homelab environments only.
# For production, use LDAP, OIDC, or another enterprise identity provider.
#
# Prerequisites:
#   1. Create the htpasswd file:
#      htpasswd -c -B -b /tmp/htpasswd admin <password>
#   2. Create the secret in the openshift-config namespace:
#      oc create secret generic htpass-secret \
#        --from-file=htpasswd=/tmp/htpasswd \
#        -n openshift-config
#   3. Apply this manifest:
#      oc apply -f cluster/oauth/htpasswd-oauth.yaml
#   4. Grant cluster-admin to the new user (if desired):
#      oc adm policy add-cluster-role-to-user cluster-admin admin
#
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: htpasswd
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          # Secret must exist in openshift-config namespace — see prerequisites above.
          name: htpass-secret
