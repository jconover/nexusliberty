---
# IHS Load Balancer Deployment — reverse proxies to Liberty pods
# Replicates the traditional WAS ND + IHS pattern on OKD.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusliberty-ihs
  namespace: liberty-apps
  labels:
    app.kubernetes.io/name: nexusliberty-ihs
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: nexusliberty
    app.kubernetes.io/component: load-balancer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusliberty-ihs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexusliberty-ihs
        app.kubernetes.io/part-of: nexusliberty
        app.kubernetes.io/component: load-balancer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nexusliberty-ihs
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ihs
          # CI workflow (.github/workflows/ihs-build.yml) pushes SHA-tagged images.
          # Argo CD or CI overrides this tag on each deploy. Using :latest as the
          # base reference — the IHS image is rebuilt infrequently.
          image: ghcr.io/jconover/nexusliberty-ihs:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ihs-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ihs-health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
