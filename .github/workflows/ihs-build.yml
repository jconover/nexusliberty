name: Build and Push IHS Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/ihs/**'
  pull_request:
    paths:
      - 'docker/ihs/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ghcr.io/jconover/nexusliberty-ihs
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push IHS image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./docker/ihs/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Post-merge only — update IHS deployment manifest with the new SHA tag
  # so Argo CD syncs the pinned image reference (same pattern as Liberty pipeline).
  update-manifest:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update IHS deployment manifest with SHA tag
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          sed -i "s|image: ghcr.io/jconover/nexusliberty-ihs:.*|image: ghcr.io/jconover/nexusliberty-ihs:${SHA_TAG}|" \
            openshift/ihs-deployment/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openshift/ihs-deployment/deployment.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update IHS image tag to sha-$(echo ${{ github.sha }} | cut -c1-7) [gha]"
            git push
          fi
