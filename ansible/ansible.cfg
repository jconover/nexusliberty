[defaults]
inventory = inventory/hosts.ini
roles_path = roles
# VAGRANT/LAB ONLY — Vagrant VMs regenerate host keys on each 'vagrant destroy/up'.
# In production, remove this line and manage known_hosts via ssh-keyscan or Vault.
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
# Scoped to playbook level because all WAS admin tasks require root.
# In production, prefer per-task 'become: true' for least-privilege.
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# StrictHostKeyChecking=no is safe here: targets are ephemeral Vagrant VMs on a
# private 192.168.56.0/24 network with no route to the internet.
# In production, remove StrictHostKeyChecking=no and use known_hosts.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
